spring:
  application:
    name: gestao-tcc
  flyway:
    enabled: true
    locations: classpath:db/migration
  datasource:
    url: jdbc:postgresql://localhost:5432/gestaotcc_db
    username: postgres
    password: 1234
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 8081

cursor:
  ai:
    enabled: ${CURSOR_AI_ENABLED:false}
    api-key: ${CURSOR_AI_API_KEY:}
    api-url: ${CURSOR_AI_API_URL:https://api.openai.com/v1/chat/completions}
    model: ${CURSOR_AI_MODEL:cursor-small-latest}
    provider: ${CURSOR_AI_PROVIDER:OPENAI}
