spring:
  application:
    name: gestao-tcc
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:default}
  flyway:
    enabled: true
    locations: classpath:db/migration
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/gestaotcc_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:1234}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:none}
    show-sql: ${SHOW_SQL:true}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  # Configuração de Email
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:siga.tcc.notificacao@gmail.com}
    password: ${MAIL_PASSWORD:lqpe uflp pbsi kcki}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
  thymeleaf:
    enabled: false

server:
  port: ${PORT:8081}

app:
  name: ${APP_NAME:Gestão TCC}

# CORS - aceita múltiplas origens separadas por vírgula
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

cursor:
  ai:
    enabled: ${CURSOR_AI_ENABLED:false}
    api-key: ${CURSOR_AI_API_KEY:}
    api-url: ${CURSOR_AI_API_URL:https://api.openai.com/v1/chat/completions}
    model: ${CURSOR_AI_MODEL:cursor-small-latest}
    provider: ${CURSOR_AI_PROVIDER:OPENAI}
