spring.application.name=gestao-tcc
spring.flyway.enabled=true
spring.flyway.validate-on-migrate=false
spring.datasource.url=jdbc:postgresql://localhost:5432/gestaotcc_db
spring.datasource.username=postgres
spring.datasource.password=1234
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
server.port=8081

# Configuração da integração com IA (Cursor)
# Permite habilitar via variável de ambiente:
#   CURSOR_AI_ENABLED=true
#   CURSOR_AI_API_KEY=seu_token
#   CURSOR_AI_API_URL=https://api.openai.com/v1/chat/completions
#   CURSOR_AI_MODEL=gpt-4o-mini
#   CURSOR_AI_PROVIDER=OPENAI
cursor.ai.enabled=${CURSOR_AI_ENABLED:false}
cursor.ai.api-key=${CURSOR_AI_API_KEY:}
cursor.ai.api-url=${CURSOR_AI_API_URL:https://api.openai.com/v1/chat/completions}
cursor.ai.model=${CURSOR_AI_MODEL:cursor-small-latest}
cursor.ai.provider=${CURSOR_AI_PROVIDER:OPENAI}
workspace.google.enabled=${GOOGLE_WORKSPACE_ENABLED:true}
workspace.google.credentials-path=${GOOGLE_CREDENTIALS_PATH:}
workspace.google.parent-folder-id=${GOOGLE_PARENT_FOLDER_ID:}
workspace.google.fallback-editor-email=${GOOGLE_FALLBACK_EDITOR_EMAIL:}
workspace.google.oauth-client-id=${GOOGLE_OAUTH_CLIENT_ID:}
workspace.google.oauth-client-secret=${GOOGLE_OAUTH_CLIENT_SECRET:}
workspace.google.oauth-refresh-token=${GOOGLE_OAUTH_REFRESH_TOKEN:}